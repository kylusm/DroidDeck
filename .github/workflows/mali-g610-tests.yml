name: Mali G610 regression tests

on:
  push:
    branches:
      - feat/panvk-mali-g610-universal
    paths:
      - 'app/src/main/java/com/droiddeck/launcher/gpu/**'
      - 'app/src/test/java/com/droiddeck/launcher/gpu/**'
      - '.github/workflows/mali-g610-tests.yml'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mali-g610-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-unit-tests:
    name: Mali GPU detection and driver selection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu image already contains the Android SDK. Avoid
      # setup-android's legacy "tools" package install (removed from sdkmanager).
      - name: Expose preinstalled Android SDK tools
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          test -x /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          test -d /usr/local/lib/android/sdk/platforms/android-34

      # The app Gradle script checks for all add-on pack files during configuration.
      # This job only compiles/runs JVM unit tests; it never packages an APK, so
      # zero-byte placeholders are sufficient and are not valid distributable packs.
      - name: Satisfy unit-test-only pack configuration
        run: |
          mkdir -p app/build/packs
          for pack in proot directaudio tracking xbox comet butler powervr; do
            : > "app/build/packs/$pack.tar.zst"
          done

      - name: Run GPU unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testReleaseUnitTest \
            --tests 'com.droiddeck.launcher.gpu.MaliG610PanvkTest' \
            --tests 'com.droiddeck.launcher.gpu.MaliG610McVariantsTest' \
            -PskipRust=true -PskipVkBridge=true --console=plain --stacktrace 2>&1 | tee mali-g610-tests.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mali-g610-unit-test-report
          path: |
            mali-g610-tests.log
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 14
